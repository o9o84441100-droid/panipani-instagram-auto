name: First live Instagram Reel (one-time)
on:
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: panipani-one-time-first-reel
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-24.04
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        name: Skip if first Reel is already recorded
        run: |
          if test -f state/first_reel.done; then
            echo "should_publish=false" >> "$GITHUB_OUTPUT"
            echo "First Reel already completed."
          else
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          fi
  first_reel:
    needs: guard
    # LEGACY ORIGINAL-RENDERER ENTRYPOINT DISABLED. Never publish non-Canva media.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install video generation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg
          pip install -r requirements.txt pillow
      - name: Generate original video and stage public-only MP4
        run: python prepare_pages.py
      - name: Validate video format
        run: |
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height -of json site/reels/*.mp4
          test -s caption.txt
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy public MP4 to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Wait for Pages MP4 delivery
        env:
          PAGES_BASE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          VIDEO_URL="${PAGES_BASE_URL%/}/reels/$(cat video_filename.txt)"
          export VIDEO_URL
          python - <<'PY'
          import os, time, requests
          url = os.environ["VIDEO_URL"]
          for attempt in range(20):
              try:
                  resp = requests.get(url, headers={"Range": "bytes=0-4095"}, timeout=15)
                  if resp.status_code in (200,206) and b"ftyp" in resp.content[:64]:
                      print("MP4 publicly accessible")
                      break
                  print("MP4 not yet accessible; HTTP",resp.status_code)
              except requests.RequestException as e:
                  print("Media host not ready:", type(e).__name__)
              time.sleep(15)
          else:
              raise RuntimeError("GitHub Pages video URL is not accessible; no Instagram publication attempted")
          PY
      - name: Post to Instagram only after public media hosting succeeds
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: '28854255504200287'
          PUBLISH_MODE: publish
          CONFIRM_PUBLICATION: 'YES'
          PAGES_BASE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          export VIDEO_URL="${PAGES_BASE_URL%/}/reels/$(cat video_filename.txt)"
          export CAPTION="$(cat caption.txt)"
          echo "Checking public video delivery and publishing via official API."
          python publisher.py
      - name: Record the first Reel test as completed
        run: |
          mkdir -p state
          printf 'First authorized Reel publishing workflow completed. Run ID: %s\n' "$GITHUB_RUN_ID" > state/first_reel.done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/first_reel.done
          git commit -m 'Mark first Instagram Reel publishing complete'
          git push
