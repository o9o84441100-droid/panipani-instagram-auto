name: Validate Canva-inspired Reel visuals (no publishing)
on:
  push:
    paths:
      - visual_renderer.py
      - test_visual_renderer.py
      - .github/workflows/validate-creative.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Japanese fonts and Pillow
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk ffmpeg
          pip install pillow
      - name: Verify visual modes and mobile dimensions
        run: python -m unittest -v test_visual_renderer
      - name: Render one complete creative Reel illustration sequence
        run: python visual_renderer.py
      - name: Archive rendered PNG previews
        uses: actions/upload-artifact@v4
        with:
          name: creative-reel-frames
          path: output/visual_demo/frame_*.png
          retention-days: 7
