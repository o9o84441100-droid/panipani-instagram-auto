name: Panipani Canva-only Reels - awaiting official export setup
# Owner policy 2026-10-13: every future Reel MUST contain Canva-created
# material. Scheduled publishing is PAUSED until a tested Canva media ingest exists.
# Never silently fall back to generated Canva-inspired-only visuals.
on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'JST posting slot to publish once today'
        required: true
        type: choice
        default: '0800'
        options:
          - '0800'
          - '1000'
          - '1200'
          - '1800'
          - '2100'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: panipani-daily-publication
  cancel-in-progress: false
jobs:
  guard:
    runs-on: ubuntu-24.04
    outputs:
      should_publish: ${{ steps.slot.outputs.should_publish }}
      slot_key: ${{ steps.slot.outputs.slot_key }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - id: slot
        name: Check JST slot and durable publication ledger
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ inputs.slot }}
        run: python daily_reel.py guard >> "$GITHUB_OUTPUT"
  publish:
    needs: guard
    # Fail closed: no Canva-generated MP4 handoff is authenticated yet.
    # Re-enable only after official Canva Connect export is fully integrated,
    # verified, and the publish job directly consumes Canva-exported video.
    if: ${{ false }}
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source and slot ledger
        uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install FFmpeg and Japanese typography
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk ffmpeg
          pip install -r requirements.txt pillow cryptography
      - name: Generate a real Canva autofilled and MP4-exported Reel
        env:
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN: ${{ secrets.CANVA_REFRESH_TOKEN }}
          CANVA_TOKEN_KEY: ${{ secrets.CANVA_TOKEN_KEY }}
          CANVA_TEMPLATE_IDS: ${{ vars.CANVA_TEMPLATE_IDS }}
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ inputs.slot }}
        run: python canva_connect_export.py
      - name: Verify actual Canva MP4, AAC soundtrack, and provenance
        run: |
          ffprobe -v error -show_entries stream=codec_name,width,height -of json site/reels/*.mp4
          test -s output/caption.txt
          test -s output/canva_provenance.json
      - name: Archive generated video for review
        uses: actions/upload-artifact@v4
        with:
          name: panipani-${{ needs.guard.outputs.slot_key }}
          path: |
            site/reels/*.mp4
            output/caption.txt
          retention-days: 30
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Package only the public video files
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy video temporarily to HTTPS
        id: deploy
        uses: actions/deploy-pages@v4
      - name: Ensure public MP4 is accessible before publishing
        env:
          PAGES_BASE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          export VIDEO_URL="${PAGES_BASE_URL%/}/reels/$(cat output/filename.txt)"
          python - <<'PY'
          import os, time, requests
          url = os.environ["VIDEO_URL"]
          if not url.startswith("https://"):
              raise RuntimeError("Pages did not return an HTTPS URL")
          for retry in range(30):
              try:
                  resp = requests.get(url, headers={"Range":"bytes=0-4095"}, timeout=20)
                  if resp.status_code in (200,206) and b"ftyp" in resp.content[:64]:
                      print("Public MP4 confirmed:", url)
                      break
                  print("Video delivery not ready:", resp.status_code)
              except requests.RequestException as e:
                  print("Waiting for video delivery:", type(e).__name__)
              time.sleep(10)
          else:
              raise RuntimeError("Media URL unavailable: no Instagram publish attempted")
          PY
      - name: Publish through Instagram API with duplicate guard
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: '28854255504200287'
          PUBLISH_MODE: publish
          CONFIRM_PUBLICATION: 'YES'
          PUBLISH_RESULT_PATH: output/publish_result.json
          PAGES_BASE_URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          export VIDEO_URL="${PAGES_BASE_URL%/}/reels/$(cat output/filename.txt)"
          export CAPTION="$(cat output/caption.txt)"
          python publisher.py
      - name: Record confirmed Instagram post in durable ledger
        env:
          GITHUB_EVENT_SCHEDULE: ${{ github.event.schedule }}
          MANUAL_SLOT: ${{ inputs.slot }}
        run: python daily_reel.py record
      - name: Commit posted slot marker (skip on future reruns)
        run: |
          set -e
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add state/posts/
          git commit -m "Record Panipani Reel ${{ needs.guard.outputs.slot_key }}"
          for n in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "Publication ledger persisted"
              exit 0
            fi
            sleep 3
          done
          echo "ALERT: Media may already be published but Git ledger push failed!"
          exit 1
