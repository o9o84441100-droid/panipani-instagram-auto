name: Validate Canva-only JST posting schedule (NO PUBLICATION)
on:
  push:
    paths:
      - daily_topics.py
      - daily_reel.py
      - audit_previous_day.py
      - test_daily.py
      - test_audit.py
      - canva_copy.py
      - .github/workflows/validate-daily.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Verify JST slot mapping, pause switch, launch-day audit, and duplicate guard
        run: |
          python -m compileall -q daily_topics.py daily_reel.py audit_previous_day.py
          python -m unittest -v test_daily test_audit
      - name: Verify actual Canva source is the only approved scheduled publisher
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path(".github/workflows/panipani-daily-reels.yml").read_text()
          assert "python canva_connect_export.py" in text
          assert "python daily_reel.py prepare" not in text
          assert "python publisher.py" in text
          assert "group: panipani-canva-oauth" in text
          print("PASS: Schedule tests did not create or publish any video.")
          PY
