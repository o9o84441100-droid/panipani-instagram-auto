name: Panipani - live Canva export TEST (never posts to Instagram)
# Manual non-publishing QA only; no cron, no Instagram or public deployment.
on:
  # ONE-TIME gated comparison-export verification; will remove after this run.
  push:
    branches: [main]
    paths:
      - ci/canva-compare-cta-qa-20261013.txt
  workflow_dispatch:
    inputs:
      template:
        description: 'Which approved Canva design to test?'
        type: choice
        required: true
        default: 'all'
        options:
          - all
          - DAHX1n4SSpU
          - DAHX1rftBb4
          - DAHX1vFRj1g

permissions:
  contents: write
concurrency:
  # Shared with future real publisher to serialize SINGLE-USE Canva token refreshes.
  group: panipani-canva-oauth
  cancel-in-progress: false

jobs:
  canva-export-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install video inspection and Python packages
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt cryptography
      - name: Check visual text fits all curated topics before OAuth
        run: python -m unittest -v test_canva_copy test_canva_connect_pipeline
      - name: Real Canva OAuth, autofill, MP4 export for selected templates
        env:
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN: ${{ secrets.CANVA_REFRESH_TOKEN }}
          CANVA_TOKEN_KEY: ${{ secrets.CANVA_TOKEN_KEY }}
          CANVA_TEMPLATE_IDS: ${{ vars.CANVA_TEMPLATE_IDS }}
          CANVA_TEST_TEMPLATE: ${{ inputs.template || 'DAHX1rftBb4' }}
        run: python canva_live_test.py
      - name: Archive all Canva videos for manual review (never publish)
        uses: actions/upload-artifact@v4
        with:
          name: panipani-real-canva-export-test
          path: |
            canva-test-output/*.mp4
            canva-test-output/manifest.json
          retention-days: 7
