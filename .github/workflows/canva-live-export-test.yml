name: Panipani - live Canva export TEST (never posts to Instagram)

# One-time manual check of actual Canva Connect OAuth -> autofill -> Canva MP4.
# Deliberately NO schedule, deploy, or Instagram publishing step.
on:
  workflow_dispatch:
    inputs:
      template:
        description: 'Canva design to test'
        required: true
        type: choice
        default: 'DAHX1n4SSpU'
        options:
          - 'DAHX1n4SSpU'
          - 'DAHX1rftBb4'
          - 'DAHX1vFRj1g'

permissions:
  contents: write   # Only to persist encrypted, rotating Canva refresh token.
concurrency:
  group: panipani-canva-live-export
  cancel-in-progress: false

jobs:
  canva-export-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install local media validator and OAuth libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          python -m pip install -r requirements.txt cryptography
      - name: Real Canva design autofill and MP4 export (NO Instagram API)
        env:
          CANVA_CLIENT_ID: ${{ secrets.CANVA_CLIENT_ID }}
          CANVA_CLIENT_SECRET: ${{ secrets.CANVA_CLIENT_SECRET }}
          CANVA_REFRESH_TOKEN: ${{ secrets.CANVA_REFRESH_TOKEN }}
          CANVA_TOKEN_KEY: ${{ secrets.CANVA_TOKEN_KEY }}
          CANVA_TEMPLATE_IDS: ${{ vars.CANVA_TEMPLATE_IDS }}
          TEMPLATE: ${{ inputs.template }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import canva_connect_export as ce
          from canva_oauth import get_access_token

          allowed = [x.strip() for x in os.environ.get("CANVA_TEMPLATE_IDS", "").split(",") if x.strip()]
          template = os.environ["TEMPLATE"]
          if template not in allowed:
              raise RuntimeError("Selected Canva template is not included in CANVA_TEMPLATE_IDS")
          if len(allowed) != 3:
              raise RuntimeError("Set CANVA_TEMPLATE_IDS to the three approved templates")
          for key in ("CANVA_CLIENT_ID","CANVA_CLIENT_SECRET","CANVA_REFRESH_TOKEN","CANVA_TOKEN_KEY"):
              if not os.getenv(key):
                  raise RuntimeError("Missing GitHub secret: " + key)
          print("Starting real Canva-only export test. No Instagram posting is possible in this workflow.")
          client = ce.Client(get_access_token())  # rotates and durably encrypts refresh token first
          print("Canva OAuth refresh and secure token rotation succeeded.")
          design_id = client.create_for_post(
              template,
              "AIで要点整理",
              "長い資料を整理",
              "要点を3つにまとめて",
              "事実を確認",
          )
          print("Canva autofill created design ID:", design_id)
          export_id, media_url = client.export_video(design_id)
          print("Canva MP4 export job:", export_id)
          filename = Path("canva-test-output/panipani-canva-live-test.mp4")
          ce.download_mp4(media_url, filename)
          ce.normalize_audio(filename)
          meta = ce.verify_video(filename)
          ce.write_provenance(filename, template, design_id, export_id)
          Path("canva-test-output").mkdir(exist_ok=True)
          Path("canva-test-output/result.json").write_text(
              json.dumps({
                "result": "REAL_CANVA_EXPORT_VERIFIED",
                "source_template": template,
                "new_canva_design_id": design_id,
                "mp4_bytes": filename.stat().st_size,
                "mp4_duration_seconds": float(meta["format"]["duration"]),
                "width": 1080, "height": 1920,
              }, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print("PASS: Real Canva-rendered 1080x1920 MP4 with H.264 and AAC.")
          print("Video stored as Actions artifact, not published to Instagram.")
          PY
      - name: Save private review media artifact (never publish)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: panipani-real-canva-export-test
          path: |
            canva-test-output/panipani-canva-live-test.mp4
            canva-test-output/result.json
          retention-days: 7
