name: Validate Canva-only source gate (never publish)
on:
  push:
    paths:
      - canva_connect_export.py
      - canva_oauth.py
      - canva_copy.py
      - daily_topics.py
      - test_canva_copy.py
      - test_canva_connect_pipeline.py
      - publisher.py
      - .github/workflows/panipani-daily-reels.yml
      - .github/workflows/validate-canva-only.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Canva Connect HTTP client
        run: pip install requests cryptography
      - name: Verify export contract and block non-Canva sources
        run: python -m unittest -v test_canva_connect_pipeline test_canva_copy
      - name: Verify old automatically created videos cannot be posted
        run: |
          python - <<'PY'
          from pathlib import Path
          wf = Path(".github/workflows/panipani-daily-reels.yml").read_text()
          assert "python canva_connect_export.py" in wf
          assert "python daily_reel.py prepare" not in wf
          assert "group: panipani-canva-oauth" in wf
          assert "PANIPANI_PUBLICATION_ENABLED" in wf
          scheduled = "  schedule:" in wf
          if scheduled:
              assert "if: needs.guard.outputs.should_publish == 'true'" in wf
              assert "PANIPANI_PUBLICATION_ENABLED: 'true'" in wf
              assert "python publisher.py" in wf
              assert "output/canva_provenance.json" in wf
          else:
              assert "if: " + "$" + "{{ false }}" in wf
          print("Canva-only validation:", "safe scheduled mode" if scheduled else "safe paused mode")
          p = Path("publisher.py").read_text()
          assert "require_canva_provenance()" in p
          print("Canva-only policy enforced: never allow non-Canva visual sources")
          PY
