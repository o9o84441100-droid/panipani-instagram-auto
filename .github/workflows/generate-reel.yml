name: Generate reel draft (no publishing)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install Japanese fonts and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk ffmpeg
          pip install pillow
      - name: Generate original reel MP4
        run: python generate_reel.py
      - name: Save video as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: panipani-reel-draft
          path: output/panipani_reel.mp4
          retention-days: 7
